name: Bug report
description: Something in the dashboard or a parser is wrong.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Before you paste anything:** this app reads transcripts full of your
        real code and file paths, and this issue is public. Warnings, stack
        traces and parser output from this app usually contain an absolute
        path with your username in it. **Redact paths, and never attach a
        transcript, a `data/` archive or an `out/` report.**

        If what you found looks exploitable, please use
        [private vulnerability reporting](https://github.com/naimulnashid/ai-usage-tracker/security/advisories/new)
        rather than this form.

  - type: dropdown
    id: agent
    attributes:
      label: Which agent?
      options:
        - Claude Code
        - Codex
        - Both
        - Not agent-specific (UI, login, setup)
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: parse
    attributes:
      label: What `npm run parse` printed
      description: >
        For anything about numbers, this is the most useful thing you can
        include — it is the same data the dashboard renders, without the web
        layer. Use `npm run parse:codex` for Codex. **Redact the paths.**
      render: text

  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: Windows 11, Node 22.11.0
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.12.0, or the commit you are on

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed real file paths, project names and usernames from everything above.
          required: true
