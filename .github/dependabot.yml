# Dependency updates.
#
# Weekly rather than daily, and grouped, because this is a single-maintainer
# project: a stream of one-line PRs is noise that gets ignored, and ignored
# update PRs are worse than none.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message:
      prefix: chore
      include: scope
    groups:
      # `eslint-config-next` must stay on the same major as `next` — it lints
      # for a framework version, and letting the two drift apart means linting
      # against rules for a Next this app is not on. Grouping them is what
      # stops Dependabot proposing that drift one package at a time.
      next:
        patterns:
          - next
          - eslint-config-next
      # Everything else: one PR for the safe bumps, majors on their own so
      # they get read rather than rubber-stamped.
      minor-and-patch:
        patterns: ['*']
        exclude-patterns:
          - next
          - eslint-config-next
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['dependencies']
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
