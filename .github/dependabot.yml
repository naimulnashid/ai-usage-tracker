# Dependency updates.
#
# Weekly rather than daily, and grouped, because this is a single-maintainer
# project: a stream of one-line PRs is noise that gets ignored, and ignored
# update PRs are worse than none.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # `@types/node` describes Node's API, so its major has to follow the
      # Node versions this app runs on - `engines` and the CI matrix - not the
      # newest Node there is. Ahead of them, code using an API the supported
      # versions lack still typechecks, and fails only at runtime. Move it by
      # hand, together with the CI matrix, when the supported range moves.
      # Minor and patch updates still arrive.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ESLint 10 and TypeScript 7 wait for Next.js's lint stack (the owner's
      # decision, 2026-10-01). eslint-config-next's own peer ranges are
      # open-ended and prove nothing; the plugins it bundles are what block
      # them - eslint-plugin-react, -import and -jsx-a11y accept ESLint 9 at
      # most, and typescript-eslint accepts TypeScript below 6.1. The
      # health check's dependency section says how to tell when that lifts.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # `eslint-config-next` must stay on the same major as `next` — it lints
      # for a framework version, and letting the two drift apart means linting
      # against rules for a Next this app is not on. Grouping them is what
      # stops Dependabot proposing that drift one package at a time.
      next:
        patterns:
          - next
          - eslint-config-next
      # Everything else: one PR for the safe bumps, majors on their own so
      # they get read rather than rubber-stamped.
      minor-and-patch:
        patterns: ['*']
        exclude-patterns:
          - next
          - eslint-config-next
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['dependencies']
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
